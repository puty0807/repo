<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2e8">
  <title>Ｐ.Ｈ.Ｓ | パッケージ一覧</title>
  <link rel="icon" type="image/png" href="./CydiaIcon.png">
  <link rel="stylesheet" href="./explorer.css?v=5">
  <script src="./i18n.js?v=1" defer></script>
  <script src="./explorer.js?v=4" defer></script>
</head>
<body>
  <main class="layout">
    <header class="source" aria-labelledby="source-title">
      <div class="brand">
        <img src="./CydiaIcon@2x.png" width="52" height="52" alt="">
        <div><h1 id="source-title">Ｐ.Ｈ.Ｓ</h1><p>ツイークの詳細</p></div>
      </div>
    </header>

    <section class="explorer" aria-labelledby="explorer-title">
      <header class="explorer-heading">
        <h2 id="explorer-title" lang="en">Package Explorer</h2>
        <p>ツイークの説明、スクリーンショット、対応環境を確認できる。</p>
      </header>
      <div class="filters">
        <label><span>パッケージ名・機能で検索</span><input id="package-search" type="search" placeholder="例　PIN、クリップ履歴、付箋"></label>
        <label><span>カテゴリ</span><select id="category"><option value="">すべてのカテゴリ</option></select></label>
      </div>
      <p id="result-count" class="result-count" role="status"></p>
      <div class="package-grid" id="package-grid"></div>
      <div class="empty" id="no-results" hidden>
        <p>条件に合うパッケージがないよ。</p>
        <button type="button" class="control" id="clear-filters">検索条件をクリア</button>
      </div>
      <noscript><p>一覧を表示するにはJavaScriptを有効にしてね。ソース登録はＰ.Ｈ.ＳのPROFILEから。</p></noscript>
    </section>
    <footer><a href="https://puteihirose.com/profile/">Ｐ.Ｈ.Ｓ PROFILE ↗</a></footer>
  </main>

  <template id="package-card">
    <article class="package">
      <div class="package-heading">
        <span class="package-icon" aria-hidden="true"></span>
        <div class="package-heading-text">
          <h3></h3>
          <p class="byline"></p>
          <div class="tags"><span class="category-tag"></span><span class="architecture-tag"></span></div>
        </div>
      </div>
      <p class="package-summary"></p>
      <a class="control card-action">詳細を見る <span aria-hidden="true">↗</span></a>
    </article>
  </template>

  <dialog class="package-dialog" id="package-dialog" aria-labelledby="package-title">
    <header class="dialog-header">
      <div><h2 id="package-title"></h2><p class="byline" id="package-byline"></p></div>
      <form method="dialog"><button class="control" autofocus>閉じる</button></form>
    </header>
    <div class="dialog-body">
      <div class="tags"><span id="detail-category"></span><span id="detail-architecture"></span></div>
      <p id="detail-summary"></p>
      <div id="package-content"></div>
      <section aria-labelledby="info-title" class="package-info">
        <h3 id="info-title">パッケージ情報</h3>
        <dl>
          <div><dt>バージョン</dt><dd id="detail-version"></dd></div>
          <div><dt>アーキテクチャ</dt><dd id="detail-arch-value"></dd></div>
          <div><dt>パッケージID</dt><dd id="detail-id"></dd></div>
        </dl>
      </section>
    </div>
  </dialog>

  <dialog class="screenshot-dialog" id="screenshot-viewer" aria-label="スクリーンショットの拡大表示">
    <form method="dialog"><button class="control" autofocus>閉じる</button></form>
    <img id="screenshot-image" alt="">
    <div class="screenshot-controls">
      <button class="control" type="button" id="screenshot-prev">前へ</button>
      <span id="screenshot-caption" aria-live="polite"></span>
      <button class="control" type="button" id="screenshot-next">次へ</button>
    </div>
  </dialog>

  <template id="keyboard-detail">
    <section class="guide"><h3>使い方と対応環境</h3><ol><li>入力欄を開き、キーボード上のP.H.S KEYから編集する。</li><li>CLIPから履歴やお気に入りを開く。共通履歴はメモ・Safari・メッセージ・メールが対象。</li><li>Spotlight検索の対応は試験中。0.0.14では純正の「テキストをスキャン」が出たときの位置調整を見直した。</li></ol><p>iOS 15・Dopamine Rootless向け。アプリの入力欄によって表示は異なる。Spotlightの0.0.14の変更は実機再確認待ち。</p></section>
    <h3 class="gallery-heading" id="keyboard-screenshots">スクリーンショット</h3>
        <div class="tweak-gallery" role="group" aria-labelledby="keyboard-screenshots">
          <figure>
            <a href="./screenshots/keyboard-01-editor.jpg" aria-label="P.H.S KEYの編集バーを拡大"><img src="./screenshots/keyboard-01-editor.jpg" width="900" height="451" alt="切り取り・コピー・貼り付け・全選択・取り消し・カーソル移動・履歴を開くボタン" loading="lazy" decoding="async"></a>
            <figcaption>P.H.S KEYの編集バー</figcaption>
          </figure>
          <figure>
            <a href="./screenshots/keyboard-02-clip-history.jpg" aria-label="P.H.S CLIPのコピー履歴を拡大"><img src="./screenshots/keyboard-02-clip-history.jpg" width="693" height="1500" alt="検索欄、カテゴリの絞り込み、固定した項目とコピー履歴の一覧" loading="lazy" decoding="async"></a>
            <figcaption>P.H.S CLIPのコピー履歴</figcaption>
          </figure>
          <figure>
            <a href="./screenshots/keyboard-03-clip-organize.jpg" aria-label="履歴の整理画面を拡大"><img src="./screenshots/keyboard-03-clip-organize.jpg" width="900" height="1036" alt="履歴を長押しして固定・お気に入り・カテゴリを設定するメニュー" loading="lazy" decoding="async"></a>
            <figcaption>履歴を整理</figcaption>
          </figure>
          <figure>
            <a href="./screenshots/keyboard-04-clip-settings.jpg" aria-label="CLIPの設定を拡大"><img src="./screenshots/keyboard-04-clip-settings.jpg" width="900" height="692" alt="共通履歴の対象アプリ、自動保存の切り替え、履歴の一括削除" loading="lazy" decoding="async"></a>
            <figcaption>CLIPの設定</figcaption>
          </figure>
        </div>
  </template>
  <template id="pin-detail">
    <section class="guide"><h3>使い方と対応環境</h3><ol><li>サイドボタン＋音量上を押し、「通常のスクショ」か「範囲を切り取る」を選ぶ。</li><li>範囲をなぞって「固定」。コピー済みの画像は、端のピンから追加できる。</li><li>「…」からコピー・共有、OCR、QR読み取り。端のピンから直近12件の履歴を開ける。</li></ol><p>iOS 15・Dopamine Rootless向け。アプリをまたぐ基本表示は0.1.0で確認済み。0.4.0のスクショボタンからの起動は実機確認待ち。</p></section>
    <h3 class="gallery-heading" id="pin-screenshots">スクリーンショット</h3>
        <div class="tweak-gallery" role="group" aria-labelledby="pin-screenshots">
          <figure>
            <a href="./screenshots/pin-01-capture-options.jpg" aria-label="撮り方の選択画面を拡大"><img src="./screenshots/pin-01-capture-options.jpg" width="560" height="1212" alt="通常のスクショと範囲の切り取りを選ぶメニュー" loading="lazy" decoding="async"></a>
            <figcaption>撮り方を選ぶ</figcaption>
          </figure>
          <figure>
            <a href="./screenshots/pin-02-pinned-image.jpg" aria-label="固定した画像のスクリーンショットを拡大"><img src="./screenshots/pin-02-pinned-image.jpg" width="560" height="1212" alt="切り取った画像をツールバー付きで画面上に固定した状態" loading="lazy" decoding="async"></a>
            <figcaption>画像を画面に固定</figcaption>
          </figure>
          <figure>
            <a href="./screenshots/pin-03-multiple-pins.jpg" aria-label="複数枚を固定したスクリーンショットを拡大"><img src="./screenshots/pin-03-multiple-pins.jpg" width="560" height="1212" alt="複数の画像を重ねて画面に固定した状態" loading="lazy" decoding="async"></a>
            <figcaption>複数枚を同時に固定</figcaption>
          </figure>
          <figure>
            <a href="./screenshots/pin-04-actions.jpg" aria-label="PINの操作メニューの画像を拡大"><img src="./screenshots/pin-04-actions.jpg" width="640" height="756" alt="画像のコピー、共有と保存、文字認識、QR読み取り、履歴を開くメニュー" loading="lazy" decoding="async"></a>
            <figcaption>PINの操作メニュー</figcaption>
          </figure>
        </div>
  </template>
  <template id="notes-detail">
    <section class="guide"><h3>使い方と対応環境</h3><ol><li>Notesの上の帯をドラッグして移動。歯車で背景の透明度を変える。</li><li>「−」で畳む。背景を完全に透過しても、畳んだ黄色いNotesは残り、そのまま移動できる。</li></ol><p>iOS 15・Dopamine Rootless向け。本文は端末に保存され、ロック解除前の画面にも表示される。</p></section>
    <h3 class="gallery-heading" id="notes-screenshots">スクリーンショット</h3>
        <div class="tweak-gallery" role="group" aria-labelledby="notes-screenshots">
          <figure>
            <a href="./screenshots/locknote-01-expanded.jpg" aria-label="開いた状態の画像を拡大"><img src="./screenshots/locknote-01-expanded.jpg" width="560" height="1212" alt="ロック画面に表示した、黄色い見出しと透ける罫線付きのメモ" loading="lazy" decoding="async"></a>
            <figcaption>開いた状態</figcaption>
          </figure>
          <figure>
            <a href="./screenshots/locknote-02-collapsed.jpg" aria-label="折りたたんだ状態の画像を拡大"><img src="./screenshots/locknote-02-collapsed.jpg" width="560" height="1212" alt="折りたたむと黄色いNotesの見出しだけが残る" loading="lazy" decoding="async"></a>
            <figcaption>折りたたんだ状態</figcaption>
          </figure>
          <figure>
            <a href="./screenshots/locknote-03-opacity.jpg" aria-label="背景の濃さを調整の画像を拡大"><img src="./screenshots/locknote-03-opacity.jpg" width="560" height="1212" alt="歯車から開く背景の濃さのスライダー" loading="lazy" decoding="async"></a>
            <figcaption>背景の濃さを調整</figcaption>
          </figure>
        </div>
  </template>
</body>
</html>
